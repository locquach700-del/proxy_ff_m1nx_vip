name: Build M1NX Vietnamese APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          base64 --decode m1nx-project.zip.b64 > /tmp/m1nx-project.zip
          unzip -q /tmp/m1nx-project.zip -d .
          test -f m1nx-vietnamese-proxy/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p m1nx-vietnamese-proxy :app:assembleDebug

      - name: Verify APK
        run: test -s m1nx-vietnamese-proxy/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M1NX-Proxy-Vietnamese-debug
          path: m1nx-vietnamese-proxy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
